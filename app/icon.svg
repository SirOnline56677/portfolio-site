<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Adaptive favicon. The mark is pure black on a transparent ground, so on a
    dark browser tab strip it renders as a black smudge on near-black (measured
    1.29:1 against Chrome's #202124). invert(1) turns it pure white and leaves
    alpha untouched, so the ground stays transparent either way.

    This is the browser's own theme, not the site's NEGATIVE toggle — it
    applies before the page loads and site CSS can't reach it.

    The artwork is embedded rather than traced: it only exists as raster and
    there's no tracer here. Fine at favicon sizes; not truly scalable.
  -->
  <style>
    @media (prefers-color-scheme: dark) { image { filter: invert(1); } }
  </style>
  <image href="data:image/png;base64," width="256" height="256"/>
</svg>